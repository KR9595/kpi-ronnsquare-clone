<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      history.scrollRestoration = 'manual'
      window.scrollTo(0, 0)
    </script>
    <script>
      /*
       * Once-per-session preloader gate, copied from the source site's <head>; it runs before
       * first paint. The big wordmark preloader plays only on the first fresh load of a
       * session; later loads get `rs-preloader-seen` and a quick loader fade instead
       * (src/lib/intro/loaderReveal.ts). `rs-js` gates the no-JS loader failsafe;
       * `rs-first-load` lets the hero image paint under the loader (see hero.css).
       */
      document.documentElement.classList.add('rs-js')
      document.documentElement.classList.add('rs-first-load')
      ;(function () {
        try {
          if (sessionStorage.getItem('rsPreloaderSeen')) {
            document.documentElement.classList.add('rs-preloader-seen')
          } else {
            sessionStorage.setItem('rsPreloaderSeen', '1')
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preload" href="/fonts/N27-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/Gambetta-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Ronnsquare - Workplace Design &amp; Fit-Out in Paris</title>
  </head>
  <body class="is-home-entrance">
    <!-- Loader veil, static like the source so it covers the page before React mounts. -->
    <div
      id="site-loader"
      style="position: fixed; inset: 0; z-index: 210; background: #dbb6fc; pointer-events: none"
      aria-hidden="true"
    ></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
